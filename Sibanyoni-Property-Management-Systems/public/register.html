<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Sibanyoni Rentals</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        h2 { text-align: center; color: #333; margin-bottom: 0.5rem; }
        p.subtitle { text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 1.5rem; line-height: 1.4; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; font-size: 0.9rem; color: #444; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 1rem; }
        .checkbox-group input { width: auto; cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; font-weight: normal; font-size: 0.85rem; color: #555; cursor: pointer; }
        .checkbox-group a { color: #0056b3; text-decoration: none; font-weight: bold; }
        .checkbox-group a:hover { text-decoration: underline; }
        button { width: 100%; padding: 0.75rem; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 1rem; font-weight: bold; }
        button:hover { background-color: #004085; }
        .link { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
        .alert-message { padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.85rem; display: none; text-align: center; }
        .alert-error { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; }
        .alert-success { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Sibanyoni Rentals</h2>
        <p class="subtitle">Apartment Rental Management System 🏢 Browse, book, and manage apartments effortlessly.</p>
        
        <div id="status-alert" class="alert-message"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role" required>
                    <option value="tenant">Tenant</option>
                    <option value="technician">Technician</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="form-group" id="secret-code-group" style="display: none;">
                <label for="secretCode">Secret Authorization Code</label>
                <input type="password" id="secretCode" placeholder="Enter 5-digit security code">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I accept the <a href="terms.html" target="_blank">Terms and Conditions</a></label>
            </div>

            <button type="submit">Register</button>
        </form>
        
        <div class="link">
            <a href="login.html">Already have an account? 🔐 Sign in</a>
        </div>
    </div>

    <script>
        const roleSelect = document.getElementById('role');
        const secretCodeGroup = document.getElementById('secret-code-group');
        const secretCodeInput = document.getElementById('secretCode');

        roleSelect.addEventListener('change', () => {
            const selectedRole = roleSelect.value.toLowerCase();
            if (selectedRole === 'admin' || selectedRole === 'technician') {
                secretCodeGroup.style.display = 'block';
                secretCodeInput.required = true;
            } else {
                secretCodeGroup.style.display = 'none';
                secretCodeInput.required = false;
                secretCodeInput.value = '';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const alertDiv = document.getElementById('status-alert');
            alertDiv.style.display = 'none';
            alertDiv.className = 'alert-message';

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const secretCode = secretCodeInput.value.trim();
            const agreedToTerms = document.getElementById('terms').checked;

            const payload = { name, email, password, role, agreedToTerms };
            if (role === 'admin' || role === 'technician') {
                payload.secretCode = secretCode;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alertDiv.textContent = 'Registration successful! Redirecting to login...';
                    alertDiv.classList.add('alert-success');
                    alertDiv.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1200);
                } else {
                    alertDiv.textContent = data.message || 'Registration failed';
                    alertDiv.classList.add('alert-error');
                    alertDiv.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                alertDiv.textContent = 'Server connection failed.';
                alertDiv.classList.add('alert-error');
                alertDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
